name: Pano
main: com.panomc.plugins.pano.bungee.BungeeMain
version: ${version}
author: Pano MC
description: An advanced web platform for Minecraft servers.
softDepends:
  - LuckPerms
# BungeeCord's PluginDescription has no commands:/permissions:/website: fields (unlike Spigot's
# plugin.yml) -- PluginManager's YAML loader silently discards anything it doesn't recognise, so
# those blocks used to sit here dead. pano.admin (required by /pano, see Core's PanoCommand) has
# no op concept to default to on BungeeCord: grant it in BungeeCord's own config.yml permissions:
# section, or via LuckPerms.